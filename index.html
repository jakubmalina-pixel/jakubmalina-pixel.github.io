<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurátor Škoda Auto</title>
    <style>
        :root {
            --skoda-green: #4ba82e;
            --skoda-emerald: #0e3a2f;
            --dark-gray: #1a1a1a;
            --light-gray: #f4f5f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            color: #333;
        }

        .configurator-container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
        }

        /* Sekce s náhledem auta */
        .preview-section {
            flex: 1 1 55%;
            background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e4e7ec 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px;
            position: relative;
            min-height: 380px;
        }

        .preview-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-badge {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--skoda-emerald);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .color-label-badge {
            background: rgba(255,255,255,0.8);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #444;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .car-stage {
            width: 100%;
            max-width: 540px;
            margin: auto 0;
        }

        .car-stage svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.22));
            transition: transform 0.3s ease;
        }

        #car-paint {
            transition: fill 0.4s ease;
        }

        /* Sekce s ovládáním */
        .controls-section {
            flex: 1 1 45%;
            padding: 35px;
            box-sizing: border-box;
            border-left: 1px solid #eee;
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: var(--skoda-emerald);
            border-bottom: 3px solid var(--skoda-green);
            padding-bottom: 8px;
            display: inline-block;
        }

        .control-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #444;
            font-size: 0.95rem;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--skoda-green);
        }

        .color-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 1px #ccc;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            transform: scale(1.15);
            box-shadow: 0 0 0 3px var(--skoda-green);
        }

        .summary-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .price-label {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
        }

        .total-price {
            font-size: 2.1rem;
            color: var(--skoda-emerald);
            font-weight: 800;
            margin: 4px 0 0 0;
        }

        .cta-button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--skoda-green);
            color: white;
            text-align: center;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            margin-top: 18px;
            cursor: pointer;
            transition: background-color 0.25s;
        }

        .cta-button:hover {
            background-color: #3d8e24;
        }

        @media (max-width: 820px) {
            .preview-section, .controls-section {
                flex: 1 1 100%;
            }
            .controls-section {
                border-left: none;
                border-top: 1px solid #eee;
            }
        }
    </style>
</head>
<body>

    <div class="configurator-container">
        <!-- Vizuální náhled vozu -->
        <div class="preview-section">
            <div class="preview-header">
                <span class="model-badge" id="car-name-display">Octavia</span>
                <span class="color-label-badge" id="color-name-display">Bílá Candy</span>
            </div>

            <div class="car-stage">
                <!-- Dynamické SVG vozu -->
                <svg id="car-svg" viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Odlesk laku -->
                        <linearGradient id="bodyShine" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
                            <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
                            <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
                        </linearGradient>
                        <!-- Sklo oken -->
                        <linearGradient id="windowGlass" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#2c3e50"/>
                            <stop offset="100%" stop-color="#111820"/>
                        </linearGradient>
                    </defs>

                    <!-- Stín pod vozem -->
                    <ellipse cx="300" cy="208" rx="255" ry="12" fill="rgba(0,0,0,0.28)" />

                    <!-- Lakovaná karoserie -->
                    <path id="car-paint" fill="#f5f5f5" d="M 65,155 C 65,130 85,118 135,112 L 205,72 C 235,58 340,58 395,74 L 475,112 C 515,118 538,132 538,158 L 535,178 L 65,178 Z" />
                    
                    <!-- Vrstva lesku na karoserii -->
                    <path id="car-shine-path" fill="url(#bodyShine)" d="M 65,155 C 65,130 85,118 135,112 L 205,72 C 235,58 340,58 395,74 L 475,112 C 515,118 538,132 538,158 L 535,178 L 65,178 Z" />

                    <!-- Okna -->
                    <path id="car-windows" fill="url(#windowGlass)" d="M 155,110 L 212,78 C 238,67 335,67 385,80 L 452,110 Z" />
                    <!-- B-sloupek -->
                    <rect x="295" y="68" width="10" height="43" fill="#1a1a1a" />

                    <!-- Přední světlomet (vpravo) -->
                    <path d="M 505,126 L 535,134 L 525,144 L 495,136 Z" fill="#e0f7fa" stroke="#999" stroke-width="1"/>
                    <!-- Zadní svítilna (vlevo) -->
                    <path d="M 67,125 L 92,122 L 88,136 L 65,138 Z" fill="#d32f2f" />

                    <!-- Podsvícení/výřezy podběhů -->
                    <circle cx="155" cy="176" r="44" fill="#181818" />
                    <circle cx="445" cy="176" r="44" fill="#181818" />

                    <!-- Zadní kolo -->
                    <g id="wheel-rear" transform="translate(155, 176)">
                        <circle r="38" fill="#222" />
                        <circle id="rim-rear" r="24" fill="#d0d5dd" stroke="#888" stroke-width="2" />
                        <circle r="7" fill="#333" />
                        <g id="spokes-rear" stroke="#555" stroke-width="3">
                            <line x1="0" y1="-22" x2="0" y2="22" />
                            <line x1="-22" y1="0" x2="22" y2="0" />
                            <line x1="-15" y1="-15" x2="15" y2="15" />
                            <line x1="-15" y1="15" x2="15" y2="-15" />
                        </g>
                    </g>

                    <!-- Přední kolo -->
                    <g id="wheel-front" transform="translate(445, 176)">
                        <circle r="38" fill="#222" />
                        <circle id="rim-front" r="24" fill="#d0d5dd" stroke="#888" stroke-width="2" />
                        <circle r="7" fill="#333" />
                        <g id="spokes-front" stroke="#555" stroke-width="3">
                            <line x1="0" y1="-22" x2="0" y2="22" />
                            <line x1="-22" y1="0" x2="22" y2="0" />
                            <line x1="-15" y1="-15" x2="15" y2="15" />
                            <line x1="-15" y1="15" x2="15" y2="-15" />
                        </g>
                    </g>
                </svg>
            </div>

            <div style="font-size: 0.8rem; color: #777;">
                * Interaktivní vizualizace se mění podle modelu, laku a disků
            </div>
        </div>

        <!-- Ovládací prvky -->
        <div class="controls-section">
            <h1>Konfigurátor Škoda</h1>

            <div class="control-group">
                <label for="model">1. Vyberte model</label>
                <select id="model" onchange="updateConfigurator()">
                    <option value="619900" data-name="Octavia" data-type="sedan">Octavia (od 619 900 Kč)</option>
                    <option value="849900" data-name="Superb" data-type="sedan">Superb (od 849 900 Kč)</option>
                    <option value="979900" data-name="Kodiaq" data-type="suv">Kodiaq SUV (od 979 900 Kč)</option>
                    <option value="1149000" data-name="Enyaq" data-type="suv">Enyaq iV (od 1 149 000 Kč)</option>
                </select>
            </div>

            <div class="control-group">
                <label>2. Barva karoserie</label>
                <div class="color-options">
                    <button class="color-btn active" data-color="#f5f5f5" data-cname="Bílá Candy" data-price="0" style="background: #f5f5f5;" onclick="selectColor(this)" title="Bílá Candy"></button>
                    <button class="color-btn" data-color="#1c1c1e" data-cname="Černá Magic" data-price="15000" style="background: #1c1c1e;" onclick="selectColor(this)" title="Černá Magic"></button>
                    <button class="color-btn" data-color="#164293" data-cname="Modrá Race" data-price="20000" style="background: #164293;" onclick="selectColor(this)" title="Modrá Race"></button>
                    <button class="color-btn" data-color="#b5192b" data-cname="Červená Velvet" data-price="22000" style="background: #b5192b;" onclick="selectColor(this)" title="Červená Velvet"></button>
                    <button class="color-btn" data-color="#4ba82e" data-cname="Zelená Mamba" data-price="25000" style="background: #4ba82e;" onclick="selectColor(this)" title="Zelená Mamba"></button>
                    <button class="color-btn" data-color="#6e767d" data-cname="Šedá Graphite" data-price="18000" style="background: #6e767d;" onclick="selectColor(this)" title="Šedá Graphite"></button>
                </div>
            </div>

            <div class="control-group">
                <label for="wheels">3. Kola z lehké slitiny</label>
                <select id="wheels" onchange="updateConfigurator()">
                    <option value="0" data-size="22" data-rim="#d0d5dd">17" kola Rotare stříbrná (v ceně)</option>
                    <option value="16000" data-size="25" data-rim="#e2e8f0">18" kola Perseus leštěná (+16 000 Kč)</option>
                    <option value="26000" data-size="28" data-rim="#4a5568">19" kola Altair antracitová (+26 000 Kč)</option>
                </select>
            </div>

            <div class="summary-section">
                <p class="price-label">Celková doporučená cena s DPH:</p>
                <p class="total-price"><span id="price-display">619 900</span> Kč</p>
                <button class="cta-button" onclick="submitOrder()">Shrnout a objednat konfiguraci</button>
            </div>
        </div>
    </div>

    <script>
        let currentColorPrice = 0;
        let currentColorName = "Bílá Candy";

        // Tvary karoserií (Liftback vs. SUV)
        const bodyShapes = {
            sedan: {
                body: "M 65,155 C 65,130 85,118 135,112 L 205,72 C 235,58 340,58 395,74 L 475,112 C 515,118 538,132 538,158 L 535,178 L 65,178 Z",
                windows: "M 155,110 L 212,78 C 238,67 335,67 385,80 L 452,110 Z"
            },
            suv: {
                body: "M 62,155 L 72,92 C 78,68 100,56 140,54 L 355,54 C 390,54 415,72 445,102 L 515,112 C 534,116 542,132 542,158 L 538,178 L 62,178 Z",
                windows: "M 92,102 L 102,68 C 108,62 125,62 150,62 L 350,62 C 378,62 398,76 425,102 Z"
            }
        };

        function updateConfigurator() {
            const modelSelect = document.getElementById('model');
            const selectedModel = modelSelect.options[modelSelect.selectedIndex];
            
            const basePrice = parseInt(selectedModel.value);
            const modelName = selectedModel.getAttribute('data-name');
            const bodyType = selectedModel.getAttribute('data-type');

            // Změna názvu modelu
            document.getElementById('car-name-display').innerText = modelName;

            // Změna tvaru karoserie podle typu auta
            const shape = bodyShapes[bodyType];
            document.getElementById('car-paint').setAttribute('d', shape.body);
            document.getElementById('car-shine-path').setAttribute('d', shape.body);
            document.getElementById('car-windows').setAttribute('d', shape.windows);

            // Kola - cena, velikost a barva disků
            const wheelsSelect = document.getElementById('wheels');
            const selectedWheel = wheelsSelect.options[wheelsSelect.selectedIndex];
            const wheelsPrice = parseInt(selectedWheel.value);
            const rimSize = selectedWheel.getAttribute('data-size');
            const rimColor = selectedWheel.getAttribute('data-rim');

            document.getElementById('rim-rear').setAttribute('r', rimSize);
            document.getElementById('rim-front').setAttribute('r', rimSize);
            document.getElementById('rim-rear').setAttribute('fill', rimColor);
            document.getElementById('rim-front').setAttribute('fill', rimColor);

            // Výpočet a formátování ceny
            const totalPrice = basePrice + currentColorPrice + wheelsPrice;
            document.getElementById('price-display').innerText = new Intl.NumberFormat('cs-CZ').format(totalPrice);
        }

        function selectColor(btn) {
            document.querySelectorAll('.color-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');

            const colorHex = btn.getAttribute('data-color');
            currentColorName = btn.getAttribute('data-cname');
            currentColorPrice = parseInt(btn.getAttribute('data-price'));

            // Přebarvení karoserie auta
            document.getElementById('car-paint').setAttribute('fill', colorHex);
            document.getElementById('color-name-display').innerText = currentColorName;

            updateConfigurator();
        }

        function submitOrder() {
            const model = document.getElementById('car-name-display').innerText;
            const wheels = document.getElementById('wheels').options[document.getElementById('wheels').selectedIndex].text;
            const price = document.getElementById('price-display').innerText;

            alert(`Vaše konfigurace Škoda ${model}:\n• Lak: ${currentColorName}\n• Kola: ${wheels}\n• Celková cena: ${price} Kč`);
        }

        // První vykreslení
        updateConfigurator();
    </script>
</body>
</html>
